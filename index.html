<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Talenta Suruh</title></head><body><div id="loading" style="font-family:system-ui,sans-serif;padding:24px">Memuat Talenta Suruh…</div><script>
(async()=>{try{const files=["parts/p00.txt", "parts/p01.txt", "parts/p02.txt", "parts/p03.txt", "parts/p04.txt", "parts/p05.txt", "parts/p06.txt", "parts/p07.txt"];const chunks=await Promise.all(files.map(async f=>{const r=await fetch(f);if(!r.ok)throw new Error('Gagal memuat '+f);return r.text();}));const b64=chunks.join('');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(!('DecompressionStream' in window))throw new Error('Browser belum mendukung DecompressionStream');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<pre style="white-space:pre-wrap;font-family:system-ui;padding:24px">Gagal memuat prototype: '+String(e)+'</pre>';}})();
</script></body></html>
